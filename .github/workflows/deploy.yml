name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run quality

      - name: Store verified build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error

  build-and-deploy:
    needs: quality
    # Desktop releases already run the same quality gate and deploy through the
    # workstation's allowlisted SSH path. Keep CI validation for those commits,
    # but do not start a second hosted deploy that cannot reach the server.
    if: ${{ !contains(github.event.head_commit.message, '[desktop-deploy]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Validate deployment configuration
        id: deploy_config
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail

          missing=0
          for name in SSH_USER SSH_HOST SSH_PORT SSH_KEY; do
            if [[ -z "${!name-}" ]]; then
              echo "::error::Required deployment secret ${name} is empty."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          # The rsync action interpolates "$user@$host:$path" unquoted inside
          # `sh -c`, so any whitespace in these values splits the command into
          # two and silently turns the deploy into a local copy. Strip it here.
          user_clean="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          host_clean="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          port_clean="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"

          if [[ -z "$user_clean" || -z "$host_clean" || -z "$port_clean" ]]; then
            echo "::error::SSH_USER, SSH_HOST or SSH_PORT contains only whitespace."
            exit 1
          fi

          if [[ ! "$port_clean" =~ ^[0-9]+$ ]]; then
            echo "::error::SSH_PORT must be numeric."
            exit 1
          fi

          if [[ "$SSH_USER" != "$user_clean" ]]; then
            echo "::warning::SSH_USER contained whitespace or a newline and was trimmed for this deploy. Re-save the secret without trailing whitespace."
          fi
          if [[ "$SSH_HOST" != "$host_clean" ]]; then
            echo "::warning::SSH_HOST contained whitespace or a newline and was trimmed for this deploy."
          fi
          if [[ "$SSH_PORT" != "$port_clean" ]]; then
            echo "::warning::SSH_PORT contained whitespace or a newline and was trimmed for this deploy."
          fi

          # Re-register the trimmed values so they stay redacted in the log.
          echo "::add-mask::$user_clean"
          echo "::add-mask::$host_clean"

          {
            echo "user=$user_clean"
            echo "host=$host_clean"
            echo "port=$port_clean"
          } >> "$GITHUB_OUTPUT"

      # TEMPORARY: diagnosing "ssh: connect to host ... : Operation timed out".
      # Reports classifications rather than addresses so the server is not
      # revealed in the log. Never fails the job. Remove once the deploy is green.
      - name: Diagnose deploy connectivity
        shell: bash
        env:
          HOST: ${{ steps.deploy_config.outputs.host }}
          PORT: ${{ steps.deploy_config.outputs.port }}
        run: |
          set -uo pipefail

          echo "Runner public IP (allowlist this range if the server filters by IP):"
          curl -s --max-time 10 https://api.ipify.org || echo "  (could not determine)"
          echo
          echo

          echo "DNS resolution:"
          mapfile -t addrs < <(getent ahostsv4 "$HOST" 2>/dev/null | awk '{print $1}' | sort -u)
          if [[ ${#addrs[@]} -eq 0 ]]; then
            echo "  host does NOT resolve to an IPv4 address"
          else
            echo "  resolves to ${#addrs[@]} IPv4 address(es)"
            for a in "${addrs[@]}"; do
              echo "::add-mask::$a"
              case "$a" in
                10.*|127.*|192.168.*|169.254.*)
                  echo "  - PRIVATE/loopback address: unreachable from GitHub-hosted runners" ;;
                172.1[6-9].*|172.2[0-9].*|172.3[01].*)
                  echo "  - PRIVATE address: unreachable from GitHub-hosted runners" ;;
                *)
                  echo "  - public address" ;;
              esac
            done
          fi
          echo

          probe() {
            local target="$1" port="$2" label="$3" rc=0
            timeout 10 bash -c "exec 3<>/dev/tcp/${target}/${port}" 2>/dev/null || rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "  $label: OPEN"
            elif [[ $rc -eq 124 ]]; then
              echo "  $label: TIMED OUT (packets silently dropped, i.e. a firewall)"
            else
              echo "  $label: refused or unreachable (rc=$rc)"
            fi
          }

          echo "TCP probes:"
          probe "$HOST" "$PORT" "deploy host, configured port"
          if [[ "$PORT" != "22" ]]; then
            probe "$HOST" 22 "deploy host, port 22 (is SSH on a different port?)"
          fi
          probe "$HOST" 443 "deploy host, port 443 (is the host up at all?)"
          probe github.com 22 "github.com:22 (control: runner outbound SSH works)"

          exit 0

      - name: Deploy to server (rsync)
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /var/www/frontend/dist/
          remote_host: ${{ steps.deploy_config.outputs.host }}
          remote_user: ${{ steps.deploy_config.outputs.user }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_port: ${{ steps.deploy_config.outputs.port }}
