
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R/E Pro Photos</title>
    <meta name="description" content="Real estate photography, video, floor plans, 3D tours, and a simple client dashboard from R/E Pro Photos." />
    <link rel="canonical" href="https://reprodashboard.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="R/E Pro Photos" />
    <meta property="og:title" content="R/E Pro Photos - Client Dashboard" />
    <meta property="og:description" content="Book shoots, download delivered media, and manage listings, floor plans, and invoices." />
    <meta property="og:url" content="https://reprodashboard.com/" />
    <meta property="og:image" content="https://reprodashboard.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://reprodashboard.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="R/E Pro Photos client dashboard" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="R/E Pro Photos - Client Dashboard" />
    <meta name="twitter:description" content="Book shoots, download delivered media, and manage listings, floor plans, and invoices." />
    <meta name="twitter:image" content="https://reprodashboard.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="R/E Pro Photos client dashboard" />

    <!-- Match Android Chrome UI color to mobile login background -->
    <meta name="theme-color" content="#060a0e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060a0e" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#060a0e" />
    <link rel="icon" type="image/png" href="/REPRO-HQ-icon.png" />
  </head>

  <body>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
