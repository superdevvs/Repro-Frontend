
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="0fL3cG7i94IG2g9q5wA2OyBYvrH1EecoStAX615J_9s" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R/E Pro Photos</title>
    <meta name="description" content="Real estate photography, video, floor plans, 3D tours, and a simple client dashboard from R/E Pro Photos." />
    <link rel="canonical" href="https://reprodashboard.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="R/E Pro Photos" />
    <meta property="og:title" content="R/E Pro Photos - Client Dashboard" />
    <meta property="og:description" content="Book shoots, download delivered media, and manage listings, floor plans, and invoices." />
    <meta property="og:url" content="https://reprodashboard.com/" />
    <meta property="og:image" content="https://reprodashboard.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://reprodashboard.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="R/E Pro Photos client dashboard" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="R/E Pro Photos - Client Dashboard" />
    <meta name="twitter:description" content="Book shoots, download delivered media, and manage listings, floor plans, and invoices." />
    <meta name="twitter:image" content="https://reprodashboard.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="R/E Pro Photos client dashboard" />

    <!-- Match Android Chrome UI color to mobile login background -->
    <meta name="theme-color" content="#060a0e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060a0e" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#060a0e" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/brand/re/favicon-static.svg" data-re-favicon />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/re/favicon-180.png" />
    <script src="/brand/favicon-runtime.js" defer></script>
    <style>
      .boot-loader { min-height: 100dvh; display: grid; place-items: center; background: #f8fafc; }
      .dark .boot-loader { background: #060a0e; }
      .boot-loader img { display: block; width: 72px; height: 72px; }
      @media (min-width: 768px) and (min-height: 600px) { .boot-loader img { width: 144px; height: 144px; } }
      body:has(.boot-loader) { margin: 0; }
    </style>
  </head>

  <body>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading R/E Pro Photos">
        <picture>
          <source media="(prefers-reduced-motion: reduce)" srcset="/brand/re/loading-static.svg" />
          <img src="/brand/re/loading.svg" width="72" height="72" alt="" />
        </picture>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
