auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3105
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
common:
  path_prefix: /var/lib/repro-monitor/loki
  instance_addr: 127.0.0.1
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /var/lib/repro-monitor/loki/chunks
      rules_directory: /var/lib/repro-monitor/loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: /var/lib/repro-monitor/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
limits_config:
  retention_period: 336h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_query_parallelism: 4
  max_query_length: 336h
  max_entries_limit_per_query: 1000
  max_line_size: 16KB
  max_line_size_truncate: true
  reject_old_samples: true
  reject_old_samples_max_age: 336h
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32
analytics:
  reporting_enabled: false
